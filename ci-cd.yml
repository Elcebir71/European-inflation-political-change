name: ci-cd

on:
  push:
    branches: [main]
    paths: ["v3-api/**"]
  pull_request:
    branches: [main]
    paths: ["v3-api/**"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/v3-api

jobs:
  # ---------- 1) Build + temel dogrulama ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & Build
        working-directory: v3-api
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      # test projesi eklenince: dotnet test
      # artefact dogrulamasi: placeholder models.json imajda PATLAR mi?
      - name: Placeholder katsayi uyarisi (bilgilendirme)
        working-directory: v3-api
        run: |
          if grep -q '"intercept": 0.0' Data/models.json; then
            echo "::warning:: models.json hala PLACEHOLDER - gercek katsayilar icin data_prep_v2.py koş"
          fi

  # ---------- 2) Docker imaji (PR'da sadece build, main'de push) ----------
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: QEMU + Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (ve main'de push)
        uses: docker/build-push-action@v6
        with:
          context: v3-api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 3) Deploy: Azure Container Apps (main push'larinda) ----------
  deploy:
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Container Apps'e deploy et
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: v3-api
          resourceGroup: rg-v3-project
          imageToDeploy: ${{ env.IMAGE }}:${{ github.sha }}
          # Artefactlari Container Apps'e Volume/secret olarak bagla:
          # AZURE_STORAGE_* + mount ayarlari Azure tarafinda tanimli olmali.
