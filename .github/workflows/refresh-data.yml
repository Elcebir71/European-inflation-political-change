name: refresh-final-data

on:
  push:
    branches: [main]
    paths:
      - ".refresh-trigger"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements_project.txt

      - name: Regenerate final analytical artifacts
        run: python data_prep_v14_english.py

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel_dataset.csv inflation_series.csv models.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh final analytical artifacts"
          git push
